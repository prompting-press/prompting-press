# GHSA-52cp-r559-cp3m: js-yaml < 4.3.0 lets YAML merge-key chains force
# quadratic CPU consumption. Nothing here depends on js-yaml directly, so the
# vulnerable 4.2.0 arrives transitively and only an override can lift it.
#
# Declared here rather than in package.json: pnpm 10 ignores `pnpm.overrides`
# there and says so in a warning, so that spelling would rot silently at the
# next lockfile regeneration.
overrides:
  js-yaml: ^4.3.0
